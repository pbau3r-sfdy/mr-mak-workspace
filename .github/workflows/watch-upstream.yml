name: Watch upstream
# Opens (or updates) an issue when witnesstodark/mr-mak-workspace has commits that
# this fork's macos branch does not contain yet. Merging is done locally with
# Hangar's distribution/update.sh, which has the credentials to push workflow files.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos
          fetch-depth: 0
      - name: Compare with upstream
        id: compare
        run: |
          git remote add upstream https://github.com/witnesstodark/mr-mak-workspace.git
          git fetch --quiet upstream main
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream/main | head -40 > new-commits.txt
          echo "Upstream commits not in macos: $count"
      - name: Open or update the sync issue
        if: steps.compare.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.compare.outputs.count }}
        run: |
          title="Upstream update: Mr. Mak has new commits to port"
          body=$(printf 'Upstream has %s commit(s) not yet in `macos`.\n\nRun `distribution/update.sh` in the Hangar repo to merge, port and rebuild.\n\n```\n%s\n```\n' "$COUNT" "$(cat new-commits.txt)")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue edit "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
